server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # TLS/HSTS настраивайте на внешнем ingress после подключения домена.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # Reka использует inline style для позиционирования. script-src остаётся строгим.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /assets/ { expires 1y; try_files $uri =404; }
  # Не выдавать index.html вместо несуществующего API. Замените на proxy_pass своего backend.
  location /api/ { return 503; }
  location = /api { return 503; }
  location ~ /\. { deny all; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
