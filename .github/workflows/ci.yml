name: Quality and build
on:
  push:
    branches: [main, develop, stage]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check staging deploy guards
        run: python3 -m unittest discover -s scripts/tests -p test_stage_deploy.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
  builds:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        mode: [dev, pre-prod, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.mode }}
      - name: Release audit (production bundle)
        if: matrix.mode == 'prod'
        run: node scripts/release-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.mode }}-${{ github.sha }}
          path: dist/
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Check container, SPA fallback and headers
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break || sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/deep-link | grep 'id="app"'
          curl -fsSI http://127.0.0.1:8080/ | grep -i 'Content-Security-Policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/test)" = "503"
      - if: always()
        run: docker compose logs && docker compose down

  stage-deploy:
    needs: [quality, builds, e2e, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage' && vars.STAGING_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: staging
      url: https://stage.app-lid-radar.ru
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy the checked frontend SHA to staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
          WEB_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo '::error::Missing staging SSH secrets'; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Invalid staging host'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo '::error::Invalid staging user'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((SSH_PORT >= 1 && SSH_PORT <= 65535)) || { echo '::error::Invalid SSH port'; exit 1; }
          [[ "$WEB_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid frontend SHA'; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          chmod 700 "$tmp"
          printf '%s\n' "$SSH_KEY" > "$tmp/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$tmp/known_hosts"
          chmod 600 "$tmp/key" "$tmp/known_hosts"
          ssh -T -i "$tmp/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$tmp/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" "deploy-web $WEB_COMMIT"
